<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trial Finder</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<h1>Trial Finder</h1>

<section class="profile">
  <label>Conditions <input id="conditions" value="diabetes"></label>
  <label>Age <input id="age" type="number" value="58"></label>
  <label>Medications <input id="medications" value="metformin, lisinopril"></label>
  <div class="row">
    <button id="search-button">Search</button>
    <button id="match-button">Update matches</button>
    <progress id="progress" max="1" value="0"></progress>
    <span id="status"></span>
  </div>
</section>

<section class="enrichment">
  <div class="row">
    <button id="enrich-button">Enrich selected</button>
    <span id="spinner" class="spinner" hidden></span>
  </div>
  <div id="sections"></div>
</section>

<table>
  <thead><tr><th></th><th>Trial</th><th>Phase</th><th>Match</th></tr></thead>
  <tbody id="results"></tbody>
</table>

<script src="matcher.js"></script>
<script src="app.js"></script>
</body>
</html>
